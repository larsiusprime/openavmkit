name: "CLA"

# Contributors tick the CLA checkbox in the PR description and sign the CLA once on DocuSeal.
# A maintainer verifies the DocuSeal signature and applies the `cla-verified` label, which
# records the signer in signatures/version1/cla.json. See .github/scripts/cla-check.js.
#
# Security: pull_request_target runs with a write token, so this workflow must never check out
# or execute code from the PR. It checks out only the base branch (the default for
# pull_request_target) to load the check script.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, labeled]

permissions:
  contents: write        # record signatures in cla.json
  pull-requests: write   # post / update the status comment
  issues: write          # PR comments go through the issues comments API

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const run = require('./.github/scripts/cla-check.js');
            await run({ github, context, core });
