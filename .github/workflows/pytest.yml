name: Run Pytest

on:
  push:
    branches: [master]
    # The CLA bot's signature commits change no code.
    paths-ignore: ["signatures/**"]
  pull_request:
    branches: [master]
  # Run by hand from the Actions tab, or by retarget.yml when a pull request is retargeted to master.
  workflow_dispatch:

# A newer push to a pull request stops the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'                     # speeds up successive runs

      - name: Install project + deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .                # editable install of this repo

      - name: Check dependency conflicts
        run: |
          pip install pipdeptree
          pipdeptree --warn fail

      - name: Run tests
        run: python -m pytest tests/ --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report-${{ matrix.python-version }}   # unique per job
          path: report.xml
